# Render Blueprint – defines both backend and frontend services
# https://docs.render.com/infrastructure-as-code

services:
  # ── Backend (already deployed – included for completeness) ──
  - type: web
    name: ai-resume-analyzer
    runtime: docker
    rootDir: backend
    envVars:
      - key: PORT
        value: "8000"

  # ── Frontend (Static Site) ──
  - type: web
    name: ai-resume-analyzer-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    headers:
      - path: /*
        name: X-Frame-Options
        value: DENY
    routes:
      # SPA fallback – sends all non-file requests to index.html
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        value: https://ai-resume-analyzer-w8vq.onrender.com
